name: agent-loop quality

on:
  push:
    paths:
      - "agent-loop/**"
      - ".github/workflows/agent-loop-quality.yml"
  pull_request:
    paths:
      - "agent-loop/**"
      - ".github/workflows/agent-loop-quality.yml"

permissions:
  contents: read

concurrency:
  group: agent-loop-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            quality-gate: false
          - os: ubuntu-latest
            python-version: "3.12"
            quality-gate: true
          - os: ubuntu-latest
            python-version: "3.13"
            quality-gate: false
          - os: windows-latest
            python-version: "3.12"
            quality-gate: false
    defaults:
      run:
        working-directory: agent-loop
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: agent-loop/requirements/ci.lock
      - name: Install hash-locked CI dependencies
        run: python -m pip install --require-hashes -r requirements/ci.lock
      - name: Install agent-loop without dependency resolution
        run: >-
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Lint all production and test code
        if: matrix.quality-gate
        run: python -m ruff check src tests
      - name: Type-check all production code
        if: matrix.quality-gate
        run: python -m mypy --no-incremental src
      - name: Run trusted real-Agent regression gate
        if: matrix.quality-gate
        run: >-
          python -m pytest -q tests/test_agent_evaluation.py
          -k production_gate_with_real_agent_runner
      - name: Test with branch coverage
        if: matrix.quality-gate
        run: python -m coverage run -m pytest -q
      - name: Enforce project coverage floor
        if: matrix.quality-gate
        run: python -m coverage report
      - name: Enforce evaluation coverage floor
        if: matrix.quality-gate
        run: >-
          python -m coverage report
          --include="src/pi_agent_loop/evaluation/*" --fail-under=80
      - name: Run compatibility tests
        if: ${{ !matrix.quality-gate }}
        run: python -m pytest -q

  supply-chain:
    name: audit, SBOM, licenses, and distributions
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent-loop
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-loop/requirements/ci.lock
      - name: Install hash-locked CI dependencies
        run: python -m pip install --require-hashes -r requirements/ci.lock
      - name: Install agent-loop without dependency resolution
        run: >-
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Audit the locked dependency graph
        run: >-
          python -m pip_audit --strict --disable-pip --require-hashes
          -r requirements/ci.lock
      - name: Generate CycloneDX SBOM and license inventory
        shell: bash
        run: |
          mkdir -p reports
          cyclonedx-py environment \
            --pyproject pyproject.toml \
            --mc-type library \
            --output-reproducible \
            --output-format JSON \
            --output-file reports/sbom.cdx.json \
            --validate
          pip-licenses \
            --format=json \
            --output-file=reports/licenses.json
      - name: Build distributions without an isolated dependency resolver
        run: python -m build --no-isolation
      - name: Check distribution metadata
        run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Verify the wheel and packaged assets outside the checkout
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m venv "$RUNNER_TEMP/agent-loop-wheel"
          "$RUNNER_TEMP/agent-loop-wheel/bin/python" -m pip install \
            --require-hashes -r requirements/ci.lock
          "$RUNNER_TEMP/agent-loop-wheel/bin/python" -m pip install \
            --no-deps "$wheel"
          "$RUNNER_TEMP/agent-loop-wheel/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/agent-loop-wheel/bin/python" - <<'PY'
          import json
          import pathlib
          from importlib import metadata

          import pi_agent_loop

          package_path = pathlib.Path(pi_agent_loop.__file__).resolve()
          assert "site-packages" in package_path.parts, package_path
          distribution = metadata.distribution("pi-agent-loop-python")
          files = tuple(distribution.files or ())
          normalized = {str(path).replace("\\", "/"): path for path in files}

          def installed_asset(suffix: str) -> pathlib.Path:
              matches = [
                  path
                  for name, path in normalized.items()
                  if name.endswith(suffix)
              ]
              assert len(matches) == 1, (suffix, sorted(normalized))
              located = pathlib.Path(distribution.locate_file(matches[0])).resolve()
              assert located.is_file(), located
              return located

          installed_asset("pi_agent_loop/py.typed")
          eval_path = installed_asset(
              "share/pi-agent-loop/evals/agent-core-v1.json"
          )
          for name in (
              "agent.toml.example",
              "business.toml.example",
              "providers.toml.example",
              "README.md",
          ):
              installed_asset(f"share/pi-agent-loop/config/{name}")

          from pi_agent_loop.evaluation import AgentEvaluationDataset

          dataset = AgentEvaluationDataset.from_json(
              eval_path.read_text(encoding="utf-8")
          )
          assert dataset.name == "agent-core"
          assert len(dataset.cases) == 5
          print(json.dumps({"package": str(package_path), "assets": 6}))
          PY
      - name: Upload distributions and supply-chain reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-loop-distributions-and-reports
          path: |
            agent-loop/dist/*
            agent-loop/reports/*.json
          if-no-files-found: error
          retention-days: 14
